name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
      - name: Bundle the app (ad-hoc signed)
        run: scripts/build-app.sh

  integration:
    # moves a real window on the runner's display
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release && mkdir -p build && swiftc -O Tests/Integration/TestWindow.swift -o build/TestWindow
      - name: Grant Accessibility access
        # Runners have SIP off, so the system TCC database can be written. Grant every process
        # that might count as "responsible" for tilespace: the tools themselves and each ancestor
        # of this shell.
        run: |
          db="/Library/Application Support/com.apple.TCC/TCC.db"
          clients=("$PWD/.build/release/tilespace" "$PWD/.build/release/TileSpaceApp" "$PWD/build/trusted" /bin/zsh /bin/bash)
          pid=$$
          while [ "$pid" -gt 1 ]; do
            clients+=("$(ps -o comm= -p $pid)")
            pid=$(ps -o ppid= -p $pid | tr -d ' ')
          done
          printf 'granting:\n'; printf '  %s\n' "${clients[@]}"
          for c in "${clients[@]}"; do
            sudo sqlite3 "$db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, indirect_object_identifier, flags)
              VALUES ('kTCCServiceAccessibility', '$c', 1, 2, 4, 1, 'UNUSED', 0);"
          done
      - name: Integration test
        run: Tests/Integration/run.sh
      - name: Screenshot on failure
        if: failure()
        run: screencapture -x screen.png
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screen
          path: screen.png
